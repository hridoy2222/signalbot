<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quantum Voice Signal</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#050510">

</head>

<body>

<div class="app">

<h1>Quantum Voice Signal</h1>
<p>QXBroker-style OTC Voice Alert</p>

<div class="controls">

<label>Select Pair</label>

<select id="pairSelect">

<option value="EUR/USD">EUR/USD</option>
<option value="GBP/USD">GBP/USD</option>
<option value="USD/JPY">USD/JPY</option>
<option value="USD/CHF">USD/CHF</option>
<option value="AUD/USD">AUD/USD</option>
<option value="USD/CAD">USD/CAD</option>
<option value="NZD/USD">NZD/USD</option>

<option value="EUR/GBP">EUR/GBP</option>
<option value="EUR/JPY">EUR/JPY</option>
<option value="GBP/JPY">GBP/JPY</option>

<option value="AUD/JPY">AUD/JPY</option>
<option value="CAD/JPY">CAD/JPY</option>
<option value="CHF/JPY">CHF/JPY</option>

<option value="EUR/AUD">EUR/AUD</option>
<option value="EUR/CAD">EUR/CAD</option>
<option value="GBP/AUD">GBP/AUD</option>

<option value="GBP/CAD">GBP/CAD</option>
<option value="AUD/CAD">AUD/CAD</option>
<option value="AUD/NZD">AUD/NZD</option>

<option value="NZD/JPY">NZD/JPY</option>

<option value="BTC/USD">BTC/USD</option>
<option value="ETH/USD">ETH/USD</option>
<option value="XAU/USD">XAU/USD</option>

</select>

<br><br>

<label class="switch">

<input type="checkbox" id="otcMode" checked>

<span>OTC Mode</span>

</label>

</div>

<div class="signal-card">

<h2 id="pairName">EUR/USD OTC</h2>

<h1 id="signal">NO TRADE</h1>

<p id="confidence">
Confidence: 0%
</p>

<p id="reason">
Waiting for clean setup...
</p>

</div>

<button onclick="startBot()">
Start
</button>

<button onclick="stopBot()">
Stop
</button>

<div class="timer">
Next scan:
<span id="timer">60</span>s
</div>

<div id="log" class="log"></div>

</div>

<script src="script.js"></script>

</body>
</html>
